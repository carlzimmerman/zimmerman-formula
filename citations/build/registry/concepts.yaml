# Named theories / relations / models that the scripts refer to by ACRONYM or common name (not by a person's
# name), mapped to the paper(s) that introduced them. Patterns: case-sensitive regexes on comments/docstrings/
# strings; `ident`: regexes on lower-cased code identifiers. Every identifier is re-verified by fetch.py.

- label: "MOND (modified Newtonian dynamics)"
  patterns: ['\bMOND(?:ian)?\b', '\b[Mm]odified Newtonian [Dd]ynamics\b']
  ident: ['(?:^|_)mond(?:_|$)', 'mond_']
  works:
    - {doi: 10.1086/161130}                            # Milgrom 1983a, ApJ 270, 365
    - {doi: 10.1086/161131}                            # Milgrom 1983b, ApJ 270, 371
    - {doi: 10.1086/161132}                            # Milgrom 1983c, ApJ 270, 384
- label: "AQUAL / RAQUAL (Bekenstein-Milgrom Lagrangian theory)"
  patterns: ['\bR?AQUAL\b', '\bBekenstein[-–\s]+Milgrom\b']
  ident: ['aqual']
  works:
    - {doi: 10.1086/162570}                            # Bekenstein & Milgrom 1984, ApJ 286, 7
- label: "QUMOND (quasi-linear MOND)"
  patterns: ['\bQUMOND\b', '\b[Qq]uasi-?linear MOND\b']
  ident: ['qumond']
  works:
    - {doi: 10.1111/j.1365-2966.2009.16184.x}          # Milgrom 2010, MNRAS 403, 886
- label: "BIMOND (bimetric MOND)"
  patterns: ['\bBIMOND\b', '\b[Bb]imetric MOND\b']
  ident: ['bimond']
  works:
    - {doi: 10.1103/PhysRevD.80.123536}                # Milgrom 2009, PRD 80, 123536
- label: "TeVeS (tensor-vector-scalar gravity)"
  patterns: ['\bTeVeS\b', '\b[Tt]ensor[-–\s]+[Vv]ector[-–\s]+[Ss]calar\b']
  ident: ['teves']
  works:
    - {doi: 10.1103/PhysRevD.70.083509}                # Bekenstein 2004, PRD 70, 083509
- label: "AeST (aether-scalar-tensor theory)"
  patterns: ['\bAeST\b', '\b[Aa]ether[-–\s]+[Ss]calar[-–\s]+[Tt]ensor\b', '\bSkordis[-–\s]+Z[lł]osnik\b']
  ident: ['aest']
  works:
    - {doi: 10.1103/PhysRevLett.127.161302}            # Skordis & Zlosnik 2021, PRL 127, 161302
- label: "Radial acceleration relation"
  patterns: ['\bRAR\b', '\b[Rr]adial [Aa]cceleration [Rr]elation\b']
  ident: ['(?:^|_)rar(?:_|$)']
  works:
    - {doi: 10.1103/PhysRevLett.117.201101}            # McGaugh, Lelli & Schombert 2016, PRL 117, 201101
    - {doi: 10.3847/1538-4357/836/2/152}               # Lelli, McGaugh, Schombert & Pawlowski 2017, ApJ 836, 152
- label: "Baryonic Tully-Fisher relation"
  patterns: ['\bBTFR\b', '\b[Bb]aryonic Tully[-–\s]+Fisher\b']
  ident: ['btfr']
  works:
    - {doi: 10.1086/312628}                            # McGaugh, Schombert, Bothun & de Blok 2000, ApJL 533, L99
- label: "External field effect"
  patterns: ['\bEFE\b', '\b[Ee]xternal[- ][Ff]ield [Ee]ffect\b']
  ident: ['(?:^|_)efe(?:_|$)']
  works:
    - {doi: 10.1086/161130}                            # Milgrom 1983a
    - {doi: 10.1086/162570}                            # Bekenstein & Milgrom 1984
- label: "NFW halo profile"
  patterns: ['\bNFW\b', '\bNavarro[-–\s]+Frenk[-–\s]+White\b']
  ident: ['nfw']
  works:
    - {doi: 10.1086/177173}                            # Navarro, Frenk & White 1996, ApJ 462, 563
    - {doi: 10.1086/304888}                            # Navarro, Frenk & White 1997, ApJ 490, 493
- label: "Cold dark matter"
  patterns: ['\b(?:Λ|Lambda|L)?CDM\b', '\b[Cc]old [Dd]ark [Mm]atter\b']
  ident: ['lcdm']
  works:
    - {doi: 10.1086/183911}                            # Peebles 1982, ApJL 263, L1
    - {doi: 10.1038/311517a0}                          # Blumenthal, Faber, Primack & Rees 1984, Nature 311, 517
- label: "Ghost condensate"
  patterns: ['\b[Gg]host[- ][Cc]ondensat(?:e|ion)\b']
  works:
    - {doi: 10.1088/1126-6708/2004/05/074}             # Arkani-Hamed, Cheng, Luty & Mukohyama 2004, JHEP 05, 074
- label: "k-essence"
  patterns: ['\b[kK]-essence\b']
  works:
    - {doi: 10.1103/PhysRevLett.85.4438}               # Armendariz-Picon, Mukhanov & Steinhardt 2000, PRL 85, 4438
- label: "Khronometric theory (khronon)"
  patterns: ['\b[Kk]hronon\b', '\b[Kk]hronometric\b']
  ident: ['khronon', 'khronometric']
  works:
    - {doi: 10.1103/PhysRevLett.104.181302}            # Blas, Pujolas & Sibiryakov 2010, PRL 104, 181302
    - {doi: 10.1007/JHEP04(2011)018}                   # Blas, Pujolas & Sibiryakov 2011, JHEP 04, 018
- label: "Einstein-aether theory"
  patterns: ['\bEinstein[-–\s]+[Aa]ether\b', '\b[Ææ]ther theory\b']
  works:
    - {doi: 10.1103/PhysRevD.64.024028}                # Jacobson & Mattingly 2001, PRD 64, 024028
- label: "Cuscuton"
  patterns: ['\b[Cc]uscuton\b']
  ident: ['cuscuton']
  works:
    - {doi: 10.1103/PhysRevD.75.083513}                # Afshordi, Chung & Geshnizjani 2007, PRD 75, 083513
- label: "Born-Infeld / DBI action"
  patterns: ['\bDBI\b', '\bBorn[-–\s]+Infeld\b', '\bDirac[-–\s]+Born[-–\s]+Infeld\b']
  works:
    - {doi: 10.1098/rspa.1934.0059}                    # Born & Infeld 1934, Proc. R. Soc. A 144, 425
- label: "Superfluid dark matter"
  patterns: ['\b[Ss]uperfluid [Dd]ark [Mm]atter\b', '\bBerezhiani[-–\s]+Khoury\b']
  works:
    - {doi: 10.1103/PhysRevD.92.103510}                # Berezhiani & Khoury 2015, PRD 92, 103510
- label: "Fuzzy dark matter"
  patterns: ['\b[Ff]uzzy [Dd]ark [Mm]atter\b', '\bFDM\b']
  works:
    - {doi: 10.1103/PhysRevLett.85.1158}               # Hu, Barkana & Gruzinov 2000, PRL 85, 1158
- label: "Horndeski theory"
  patterns: ['\bHorndeski\b']
  ident: ['horndeski']
  works:
    - {doi: 10.1007/BF01807638}                        # Horndeski 1974, IJTP 10, 363
- label: "Galileon"
  patterns: ['\b[Gg]alileons?\b']
  works:
    - {doi: 10.1103/PhysRevD.79.064036}                # Nicolis, Rattazzi & Trincherini 2009, PRD 79, 064036
- label: "Emergent gravity (Verlinde)"
  patterns: ['\b[Ee]mergent [Gg]ravity\b', '\b[Ee]ntropic [Gg]ravity\b']
  works:
    - {doi: 10.1007/JHEP04(2011)029}                   # Verlinde 2011, JHEP 04, 029
    - {doi: 10.21468/SciPostPhys.2.3.016}              # Verlinde 2017, SciPost Phys. 2, 016
- label: "Holographic dark energy"
  patterns: ['\b[Hh]olographic [Dd]ark [Ee]nergy\b']
  works:
    - {doi: 10.1016/j.physletb.2004.10.014}            # M. Li 2004, PLB 603, 1
- label: "Modified gravity (MOG / STVG)"
  patterns: ['\bMOG\b', '\bSTVG\b', '\b[Ss]calar[-–\s]+[Tt]ensor[-–\s]+[Vv]ector [Gg]ravity\b']
  works:
    - {doi: 10.1088/1475-7516/2006/03/004}             # Moffat 2006, JCAP 03, 004
- label: "Friedmann-Lemaitre-Robertson-Walker metric"
  patterns: ['\bFL?RW\b', '\bRobertson[-–\s]+Walker\b', '\bFriedmann[-–\s]+Lema[iî]tre\b']
  ident: ['flrw', '(?:^|_)frw(?:_|$)']
  works:
    - {doi: 10.1007/BF01332580}                        # Friedmann 1922, Z. Phys. 10, 377
    - {doi: 10.1007/BF01328280}                        # Friedmann 1924, Z. Phys. 21, 326
    - {doi: 10.1093/mnras/91.5.483}                    # Lemaitre 1931 (English transl. of 1927), MNRAS 91, 483
    - {doi: 10.1086/143681}                            # Robertson 1935, ApJ 82, 284
    - {doi: 10.1112/plms/s2-42.1.90}                   # Walker 1937, Proc. LMS 42, 90
- label: "Dark-energy equation of state w0-wa (CPL)"
  patterns: ['\bCPL\b', '\bChevallier[-–\s]+Polarski[-–\s]+Linder\b', '\bw0[-–\s]*wa\b', '\bw_?0\s*[-–,]\s*w_?a\b']
  works:
    - {doi: 10.1142/S0218271801000822}                 # Chevallier & Polarski 2001, IJMPD 10, 213
    - {doi: 10.1103/PhysRevLett.90.091301}             # Linder 2003, PRL 90, 091301
- label: "Stellar-to-halo mass relation (abundance matching, Moster)"
  patterns: ['\bMoster[-–\s]+(?:Naab[-–\s]+White|relation|SMHM)\b']
  works:
    - {doi: 10.1093/mnras/sts261}                      # Moster, Naab & White 2013, MNRAS 428, 3121
- label: "Toomre stability criterion"
  patterns: ['\bToomre(?:''s)?\s+(?:Q|[Ss]tability|[Cc]riterion|[Pp]arameter|[Ii]nstability)', '\bToomre\b']
  ident: ['toomre']
  works:
    - {doi: 10.1086/147861}                            # Toomre 1964, ApJ 139, 1217
- label: "Zwicky's missing mass in clusters"
  patterns: ['\bZwicky\b']
  works:
    - {doi: 10.1086/143864}                            # Zwicky 1937, ApJ 86, 217
- label: "Pais-Uhlenbeck oscillator"
  patterns: ['\bPais[-–\s]+Uhlenbeck\b']
  works:
    - {doi: 10.1103/PhysRev.79.145}                    # Pais & Uhlenbeck 1950, Phys. Rev. 79, 145
- label: "Ornstein-Uhlenbeck process"
  patterns: ['\bOrnstein[-–\s]+Uhlenbeck\b']
  works:
    - {doi: 10.1103/PhysRev.36.823}                    # Uhlenbeck & Ornstein 1930, Phys. Rev. 36, 823
- label: "Bruzual & Charlot stellar population models (BC03)"
  patterns: ['\bBruzual\b', '\bBC03\b']
  works:
    - {doi: 10.1046/j.1365-8711.2003.06897.x}          # Bruzual & Charlot 2003, MNRAS 344, 1000
- label: "Einasto profile"
  patterns: ['\bEinasto\b']
  ident: ['einasto']
  works:
    - classic: true
      authors: ["Jaan Einasto"]
      year: 1965
      title: "On the Construction of a Composite Model for the Galaxy and on the Determination of the System of Galactic Parameters"
      venue: "Trudy Astrofizicheskogo Instituta Alma-Ata 5, 87-100"
      url: https://ui.adsabs.harvard.edu/abs/1965TrAlm...5...87E/abstract
- label: "Penrose-Diosi gravitational collapse"
  patterns: ['\bPenrose[-–\s]+Di[oó]si\b', '\bDi[oó]si[-–\s]+Penrose\b']
  works:
    - {doi: 10.1007/BF02105068}                        # Penrose 1996, Gen. Rel. Grav. 28, 581
    - {doi: 10.1016/0375-9601(87)90681-5}              # Diosi 1987, Phys. Lett. A 120, 377
