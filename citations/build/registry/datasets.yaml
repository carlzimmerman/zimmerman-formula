# Data products (surveys, data releases, catalogues, ephemerides, reference compilations) named in the scripts
# -> the release / data paper(s) that the providers ask users to cite.
# Facilities and instruments on their own (JWST, HST, ALMA, MUSE, Chandra, Keck ...) are NOT listed: the index credits
# the data papers, not the hardware. Patterns are case-sensitive Python regexes applied to comments/docstrings/strings.

- label: "SPARC rotation-curve database"
  patterns: ['\bSPARC\b', 'Rotmod_LTG', 'SPARC_Lelli2016c', 'MassModels_Lelli2016']
  works:
    - {doi: 10.3847/0004-6256/152/6/157}               # Lelli, McGaugh & Schombert 2016, AJ 152, 157
- label: "Planck 2018 results (parameters)"
  patterns: ['\bPlanck\s*(?:2018|18|2020)\b', '\bPlanck2018\b', '\bPlanck\s*PR3\b', '\bPlanck\s*(?:TT|TTTEEE|TT,TE,EE)\b',
             '\bPlanck\s+(?:best[- ]fit|baseline|cosmology|cosmological parameters|\+\s*BAO|LCDM|ΛCDM|prior)\b']
  works:
    - {doi: 10.1051/0004-6361/201833910}               # Planck Collaboration VI 2020, A&A 641, A6
- label: "Planck 2018 likelihoods"
  patterns: ['\bPlanck\s+(?:2018\s+)?likelihoods?\b', '\bplik\b']
  works:
    - {doi: 10.1051/0004-6361/201936386}               # Planck Collaboration V 2020, A&A 641, A5
- label: "Planck 2018 lensing"
  patterns: ['\bPlanck\s+(?:2018\s+)?(?:CMB\s+)?lensing\b']
  works:
    - {doi: 10.1051/0004-6361/201833886}               # Planck Collaboration VIII 2020, A&A 641, A8
- label: "Planck 2015 results (parameters)"
