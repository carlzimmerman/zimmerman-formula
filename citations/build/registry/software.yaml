# Scientific software imported by the scanned scripts -> the citation each project asks for.
# Every doi/arxiv/inspire below is re-verified against Crossref / DataCite / arXiv / INSPIRE by fetch.py;
# entries with `software:` are projects without a DOI (cited by name, version-agnostic, with their URL).
# Utilities that carry no mathematics (HTTP, PDF writing, progress bars, YAML, CLI) are deliberately not listed.

