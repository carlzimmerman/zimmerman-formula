# Numerical / statistical methods reached THROUGH library calls -> the people who invented them.
# `calls` are regexes on the qualified call name recorded by extract.py, with the literal `method=`/`kind=`
# keyword (when given) appended in brackets, e.g. "scipy.integrate.solve_ivp[DOP853]".
# Every doi/arxiv here is re-verified by fetch.py; `classic` entries are pre-DOI books/memoirs/reports.

- label: "PCG64 generator (NumPy default_rng)"
  calls: ['^numpy\.random\.(default_rng|PCG64|Generator)$']
  works:
    - classic: true
      authors: ["Melissa E. O'Neill"]
      year: 2014
      title: "PCG: A Family of Simple Fast Space-Efficient Statistically Good Algorithms for Random Number Generation"
      venue: "Harvey Mudd College, Technical Report HMC-CS-2014-0905"
      url: https://www.cs.hmc.edu/tr/hmc-cs-2014-0905.pdf
- label: "Mersenne Twister (NumPy legacy global RandomState)"
  calls: ['^numpy\.random\.(seed|uniform|normal|rand|randn|random|choice|randint|RandomState|lognormal|exponential|gamma|beta|pareto|multivariate_normal|poisson|binomial|shuffle|permutation|standard_normal|triangular|laplace|chisquare|weibull)$']
  works:
    - {doi: 10.1145/272991.272995}                      # Matsumoto & Nishimura 1998
- label: "LAPACK (dense linear algebra behind numpy.linalg / scipy.linalg)"
  calls: ['^numpy\.linalg\.(eigh|eigvalsh|eig|eigvals|svd|solve|lstsq|cholesky|qr|det|inv|pinv|slogdet|matrix_rank|cond)$',
          '^scipy\.linalg\.(eigh|eigvalsh|eig|eigvals|svd|solve|lstsq|cholesky|cho_factor|cho_solve|solve_banded|eigh_tridiagonal|eig_banded|qr|det|inv|pinv|lu|lu_factor|lu_solve|schur|null_space|orth)$']
  works:
    - {doi: 10.1137/1.9780898719604}                    # Anderson et al. 1999, LAPACK Users' Guide, 3rd ed.
- label: "Brent's method (root bracketing / scalar minimisation)"
  calls: ['^scipy\.optimize\.(brentq|brenth|brent|fminbound)$', '^scipy\.optimize\.minimize_scalar(\[(brent|bounded)\])?$']
  works:
    - classic: true
      authors: ["Richard P. Brent"]
      year: 1973
      title: "Algorithms for Minimization Without Derivatives"
      venue: "Prentice-Hall, Englewood Cliffs, NJ (Dover reprint 2002)"
      url: https://maths-people.anu.edu.au/~brent/pub/pub011.html
