# Citation text in scripts that names the wrong authors for a real paper (each checked against the publisher /
# arXiv record). build_index.py reports every match, with file and line, in UNVERIFIED.md section 1.
- pattern: 'Verwayen[-–,\s&]+Skordis[-–,\s&and]+Z[lł]o[sś]nik'
  problem: "the paper (MNRAS 531, 272, 2024; arXiv:2304.05134) is by Verwayen, Skordis & Bœhm; Złosnik is not an author"
- pattern: 'Blanchet[-–,\s&]+Marleau'
  problem: "no Blanchet–Marleau–Skordis paper exists: arXiv:2402.11716 (nonlocality) is Deffayet & Woodard 2024; the 2024 khronon paper (JCAP 11, 040) is Blanchet & Skordis"
- pattern: 'Pookkillath[^\n]{0,60}2302\.02090|DFMP\s+2302\.02090'
  problem: "arXiv:2302.02090 is Yao, Oliosi, Gao & Mukohyama 2023 (minimally modified gravity with auxiliary constraints), not De Felice, Mukohyama & Pookkillath"
- pattern: 'Hooper, Lopez, Boyarsky, Cyr-Racine'
  problem: "'One likelihood to bind them all' (JCAP 10 (2022) 032) is by Hooper, Schöneberg, Murgia, Archidiacono, Lesgourgues & Viel; the author list written here is wrong"
