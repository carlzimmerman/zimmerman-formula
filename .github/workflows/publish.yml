name: Publish Release

# Publishes a GitHub release when a v* tag is pushed.
# The release text comes ONLY from RELEASE_NOTES_<tag>.md committed at that tag (e.g. RELEASE_NOTES_v9.0.0.md).
# If that file is missing, the release is created as a DRAFT with a placeholder, so nothing unreviewed is published.
# (The previous version published a fixed body with claims that were retracted in June 2026.)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Find release notes
      id: notes
      run: |
        f="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
        if [ -f "$f" ]; then
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "draft=false" >> "$GITHUB_OUTPUT"
        else
          printf 'Draft: no RELEASE_NOTES_%s.md was committed at this tag. Add the notes and publish manually.\n' "$GITHUB_REF_NAME" > /tmp/placeholder.md
          echo "path=/tmp/placeholder.md" >> "$GITHUB_OUTPUT"
          echo "draft=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Zimmerman Framework ${{ github.ref_name }}
        body_path: ${{ steps.notes.outputs.path }}
        draft: ${{ steps.notes.outputs.draft }}
        prerelease: false
