<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Arial Narrow, Arial, sans-serif">
  <rect width="640" height="330" fill="#f3f6f5"/>
  <defs><linearGradient id="slab" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d6e8a" stop-opacity="0.22"/><stop offset="1" stop-color="#1d6e8a" stop-opacity="0.06"/></linearGradient></defs>
  <g fill="url(#slab)" stroke="#1d6e8a" stroke-opacity="0.55" stroke-width="1">
    <polygon points="70,250 290,250 380,190 160,190"/><polygon points="70,215 290,215 380,155 160,155"/><polygon points="70,180 290,180 380,120 160,120"/><polygon points="70,145 290,145 380,85 160,85"/><polygon points="70,110 290,110 380,50 160,50"/>
  </g>
  <line x1="225" y1="225" x2="225" y2="85" stroke="#b4471d" stroke-width="3"/>
  <g fill="#b4471d"><circle cx="225" cy="225" r="4"/><circle cx="225" cy="190" r="4"/><circle cx="225" cy="155" r="4"/><circle cx="225" cy="120" r="4"/><circle cx="225" cy="85" r="4"/></g>
  <g fill="#16201d" font-size="15">
    <text x="120" y="282">sky position (east–west)</text>
    <text x="330" y="246" transform="rotate(-33 330 246)">sky position (north–south)</text>
    <text x="20" y="40" fill="#56645f" font-size="14">frequency ↑</text>
    <text x="20" y="58" fill="#56645f" font-size="13">(1,055 slices)</text>
  </g>
  <g transform="translate(430,40)">
    <rect x="0" y="0" width="190" height="210" fill="#e8eeec" stroke="#cdd8d4"/>
    <text x="12" y="24" fill="#b4471d" font-size="14" font-weight="700">one pixel = one spectrum</text>
    <polyline fill="none" stroke="#16201d" stroke-width="1.6" points="14,180 30,179 46,181 60,178 70,176 78,120 86,96 94,108 102,116 110,112 118,98 126,92 134,150 142,178 156,180 176,179"/>
    <line x1="12" y1="190" x2="180" y2="190" stroke="#56645f" stroke-width="1"/>
    <text x="12" y="204" fill="#56645f" font-size="12">frequency → (along the red column)</text>
  </g>
  <line x1="232" y1="150" x2="428" y2="140" stroke="#b4471d" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
