name = "mondlean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Mondlean", "ChainCert"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "Mondlean"

[[lean_lib]]
name = "ChainCert"

# A83 algebraic-spine modules (lane A83_lean_spine).  Added as a separate library so
# `lake build A83` is a real project target; the default targets are unchanged.
[[lean_lib]]
name = "A83"
